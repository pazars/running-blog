<!doctype html>
<html lang="lv">
  <body
    class="bg-page fg-default"
    style="margin: 0; padding: 0; width: 100%; background-color: #f6f7f9; color: #090e24; -webkit-font-smoothing: antialiased; font-family: system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol';"
  >
    <!--
      Newsletter issue shell. NOT sent as-is: `npm run newsletter:build -- <issue>`
      fills %%preheader%% and %%blocks%% (from the partials in this folder) and strips
      every HTML comment. See emails/README.md.
      Same structure and palette as ../newsletter-confirm.html, with a wider card for
      article images. {{{RESEND_UNSUBSCRIBE_URL}}} is filled by Resend per recipient
      when the issue is sent as a Broadcast (Resend also adds the List-Unsubscribe
      header).
    -->
    <style>
      /* Dark-mode remap (Apple Mail, iOS Mail, some others honor this). */
      @media (prefers-color-scheme: dark) {
        .bg-page { background-color: #0d0d0d !important; }
        .bg-card { background-color: #121212 !important; }
        .bg-subtle { background-color: #1c1c1c !important; }
        .fg-default, .fg-default a { color: #e2e8f0 !important; }
        .fg-muted, .fg-muted a { color: #9aa0aa !important; }
        .border { border-color: rgba(255, 255, 255, 0.141) !important; }
        /* The accent #283cff is ~2.8:1 on the dark card and the site has no dark
           accent token, so the read-more link uses the body color + underline,
           like paragraph links already do via .fg-default a. */
        .link-cta { color: #e2e8f0 !important; text-decoration: underline !important; }
      }
      a { color: #283cff; }
    </style>

    <!-- Preheader (inbox snippet), hidden in the body -->
    <div style="display: none; max-height: 0; overflow: hidden; mso-hide: all; font-size: 1px; line-height: 1px; color: transparent; opacity: 0;">%%preheader%%</div>

    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" class="bg-page" style="width: 100%; background-color: #f6f7f9;">
      <tr>
        <td align="center" style="padding: 40px 20px 0;">
          <!-- Card -->
          <table role="presentation" width="560" align="center" cellpadding="0" cellspacing="0" border="0" class="bg-card border" style="width: 560px; max-width: 100%; margin: 0 auto; background-color: #ffffff; border: 1px solid #e7eaf1; border-radius: 12px;">
            <tr>
              <td style="padding: 32px 32px 8px;">
%%blocks%%
              </td>
            </tr>
          </table>

          <!-- Footer -->
          <table role="presentation" width="560" align="center" cellpadding="0" cellspacing="0" border="0" style="width: 560px; max-width: 100%; margin: 0 auto;">
            <tr>
              <td align="center" valign="middle" style="padding: 24px 32px 32px; text-align: center;">
                <p class="fg-muted" style="margin: 0 0 8px; font-size: 12px; line-height: 1.6; color: #757676; text-align: center;">
                  <a href="https://davispazars.lv" class="fg-muted" style="color: #757676; text-decoration: underline;">davispazars.lv</a>
                </p>
                <p class="fg-muted" style="margin: 0; font-size: 12px; line-height: 1.6; color: #757676; text-align: center;">
                  <a href="{{{RESEND_UNSUBSCRIBE_URL}}}" class="fg-muted" style="color: #757676; text-decoration: underline;">Atrakstīties no vēstkopas</a>
                </p>
              </td>
            </tr>
          </table>

        </td>
      </tr>
    </table>
  </body>
</html>
