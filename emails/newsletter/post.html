<!-- Block: { post: "<slug>" }. Values come from dist/newsletter-cards.json, built
     from the post frontmatter by src/pages/newsletter-cards.json.ts. The image is a
     760x399 JPEG (~1.5x this slot, quality 50, mozjpeg), kept small because every
     subscriber downloads it on open; JPEG renders in every client, unlike WebP.
     492 = 560 card - 2 x 1 card border - 2 x 32 padding - 2 x 1 this table's border;
     the image's 11px top radius is this table's 12px minus its 1px border. -->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" class="border" style="width: 100%; margin: 8px 0 24px; border: 1px solid #e7eaf1; border-radius: 12px; border-collapse: separate;">
  <tr>
    <td style="padding: 0;">
      <a href="%%url%%"><img src="%%image%%" width="492" alt="%%alt%%" style="display: block; width: 100%; max-width: 492px; height: auto; border: 0; border-radius: 11px 11px 0 0;" /></a>
    </td>
  </tr>
  <tr>
    <td style="padding: 20px;">
      <h2 class="fg-default" style="margin: 0 0 8px; font-size: 20px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.3; color: #090e24;">
        <a href="%%url%%" style="color: #090e24; text-decoration: none;">%%title%%</a>
      </h2>
      <p class="fg-muted" style="margin: 0 0 16px; font-size: 14px; line-height: 1.6; color: #757676;">%%summary%%</p>
      <a href="%%url%%" class="link-cta" style="font-size: 15px; font-weight: 600; color: #283cff; text-decoration: none;">Lasīt rakstu &rarr;</a>
    </td>
  </tr>
</table>
